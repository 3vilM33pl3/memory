name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Nightly Quality Sweep
    runs-on: [self-hosted, memory, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rust validation
        run: |
          cargo fmt --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Web validation
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Offline evaluation smoke
        run: |
          cp memory-layer.toml.example "$RUNNER_TEMP/memory-layer.toml"
          cargo run --locked --bin memory -- \
            --config "$RUNNER_TEMP/memory-layer.toml" \
            eval run \
            --suite evals/examples/memory-smoke \
            --condition full-memory \
            --profile offline \
            --dry-run
        env:
          MEMORY_LAYER_PROFILE: prod

      - name: Dependency audit reports
        continue-on-error: true
        run: |
          npm --prefix web audit --audit-level=high
          cargo install cargo-audit --locked
          cargo audit

  debian-package-smoke:
    name: Debian Package Smoke (amd64)
    runs-on: [self-hosted, memory, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Debian package smoke
        run: ./packaging/build-deb.sh --arch amd64 --target x86_64-unknown-linux-gnu
